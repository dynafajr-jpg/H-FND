<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H-FND Forgot Password</title>
    <!--icon-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- font -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0d0f12;
            --panel-dark: #17191d;
            --neon-green: #c8f542;
            --neon-dark: #a8d422;
            --text-main: #ffffff;
            --text-muted: #8a8f98;
            --border-color: #2b2f36;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .flash-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: 80%;
            max-width: 400px;
            text-align: center;
        }
        .flash-message {
            background: rgba(255, 77, 77, 0.2);
            border: 1px solid #ff4d4d;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 10px;
            backdrop-filter: blur(5px);
        }
        .flash-message.success {
            background: rgba(200, 245, 66, 0.2);
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
        }
        .flash-message.info {
            background: rgba(100, 150, 255, 0.2);
            border: 1px solid #6496ff;
            color: #a0b8ff;
        }

        .forgot-container {
            width: 90%;
            max-width: 500px;
            background-color: var(--panel-dark);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            padding: 50px 40px;
            text-align: center;
        }

        .form-wrapper { max-width: 350px; width: 100%; margin: 0 auto; }
        .shield-icon-container {
            font-size: 50px;
            color: var(--neon-green);
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(200, 245, 66, 0.4);
        }
        .form-wrapper h2 { font-size: 28px; font-weight: 400; margin-bottom: 10px; letter-spacing: 1px; }
        .form-wrapper h2 span { font-weight: 700; }
        .form-wrapper p { color: var(--text-muted); font-size: 13px; margin-bottom: 30px; }

        .input-group {
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 15px;
            height: 50px;
            transition: 0.3s;
        }
        .input-group:focus-within { border-color: var(--neon-green); }
        .input-group i { color: var(--text-muted); margin-right: 15px; }
        .input-group input {
            background: transparent;
            border: none;
            color: white;
            flex-grow: 1;
            font-size: 14px;
            outline: none;
            font-family: 'Montserrat', sans-serif;
        }

        .btn-primary {
            background-color: var(--neon-green);
            color: var(--bg-dark);
            border: none;
            width: 100%;
            height: 50px;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
        }
        .btn-primary:hover {
            background-color: var(--neon-dark);
            box-shadow: 0 5px 15px rgba(200, 245, 66, 0.3);
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-muted);
        }
        .back-link a {
            color: var(--neon-green);
            text-decoration: none;
        }
    </style>
</head>
<body>

    <!-- FLASH MESSAGES -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-container">
          {% for category, message in messages %}
            <div class="flash-message {{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <div class="forgot-container">
        <div class="form-wrapper">
            <div class="shield-icon-container">
                <i class="fa-solid fa-key"></i>
            </div>
            
            <h2>FORGOT <span>PASSWORD</span></h2>
            <p>Masukkan username anda. Admin akan dimaklumkan untuk reset password anda.</p>

            <form action="/forgot_password" method="POST">
                <div class="input-group">
                    <i class="fa-regular fa-user"></i>
                    <input type="text" name="username" placeholder="Username" required>
                </div>

                <button type="submit" class="btn-primary">
                    REQUEST RESET <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>

            <div class="back-link">
                <a href="/">Back to Sign In</a>
            </div>
        </div>
    </div>

</body>
</html>
