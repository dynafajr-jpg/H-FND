<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password - H-FND</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0d0f12;
            --panel-dark: #17191d;
            --border-color: #2b2f36;
            --neon-green: #c8f542;
            --text-main: #ffffff;
            --text-muted: #8a8f98;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: var(--panel-dark);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            max-width: 450px;
            width: 90%;
        }
        h2 { margin-bottom: 20px; }
        h2 span { color: var(--neon-green); }
        .input-group {
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding: 0 15px;
            height: 50px;
        }
        .input-group i { color: var(--text-muted); margin-right: 15px; }
        .input-group input {
            background: transparent;
            border: none;
            color: white;
            flex-grow: 1;
            font-size: 14px;
            outline: none;
            font-family: 'Montserrat', sans-serif;
        }
        .btn-primary {
            background: var(--neon-green);
            color: var(--bg-dark);
            border: none;
            width: 100%;
            height: 50px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 1px;
            margin-top: 10px;
        }
        .btn-primary:hover { opacity: 0.9; }
        .back-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
        }
        .back-link a { color: var(--neon-green); text-decoration: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Change <span>Password</span></h2>
    
    <form action="/change_password" method="POST">
        <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input type="password" name="current_password" placeholder="Current Password" required>
            <i class="fa-regular fa-eye toggle-password" style="cursor: pointer;"></i>
        </div>
        <div class="input-group">
            <i class="fa-solid fa-key"></i>
            <input type="password" name="new_password" 
                   placeholder="New Password (min 8 characters)" 
                   minlength="8" 
                   required>
            <i class="fa-regular fa-eye toggle-password" style="cursor: pointer;"></i>
        </div>
        <div class="input-group">
            <i class="fa-solid fa-check"></i>
            <input type="password" name="confirm_password" 
                   placeholder="Confirm New Password" 
                   minlength="8" 
                   required>
            <i class="fa-regular fa-eye toggle-password" style="cursor: pointer;"></i>
        </div>
        <button type="submit" class="btn-primary">CHANGE PASSWORD</button>
    </form>
    
    <div class="back-link">
        <a href="/settings">← Back to Settings</a>
    </div>
</div>


    <script>
    document.querySelectorAll('.toggle-password').forEach(function(icon) {
        icon.addEventListener('click', function() {
            const input = this.parentElement.querySelector('input');
            input.type = input.type === 'password' ? 'text' : 'password';
        });
    });
    </script>
    
</body>
</html>
