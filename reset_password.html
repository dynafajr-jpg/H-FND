<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-dark: #0d0f12; --panel-dark: #17191d; --panel-border: #2b2f36; --neon-green: #c8f542; --text-main: #ffffff; --text-muted: #8a8f98; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--bg-dark); color: var(--text-main); display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        .container { background-color: var(--panel-dark); border: 1px solid var(--panel-border); border-radius: 12px; padding: 40px; width: 90%; max-width: 400px; text-align: center; }
        h2 { font-size: 24px; margin-bottom: 20px; }
        
        .input-group { background-color: var(--bg-dark); border: 1px solid var(--panel-border); border-radius: 8px; display: flex; align-items: center; margin-bottom: 20px; padding: 0 15px; height: 50px; }
        .input-group input { background: transparent; border: none; color: white; flex-grow: 1; font-size: 14px; outline: none; }
        .input-group i { color: var(--text-muted); margin-right: 10px; }
        
        .btn-primary { background-color: var(--neon-green); color: var(--bg-dark); border: none; width: 100%; height: 50px; border-radius: 8px; font-weight: 700; cursor: pointer; font-family: 'Montserrat', sans-serif; }
        .btn-primary:hover { opacity: 0.8; }
        .back-link { margin-top: 15px; font-size: 12px; }
        .back-link a { color: var(--neon-green); text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>RESET PASSWORD</h2>
        
        <form action="/reset_password/{{ user_id }}" method="POST">
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" name="new_password" 
                       placeholder="New Password (min 8 characters)" 
                       minlength="8" 
                       required>
                <i class="fa-regular fa-eye toggle-password" style="cursor: pointer;"></i>
            </div>
            
            <button type="submit" class="btn-primary">Reset Password</button>
        </form>
        
        <div class="back-link">
            <a href="/manage_users">Back to Manage Users</a>
        </div>
    </div>

    <script>
    document.querySelectorAll('.toggle-password').forEach(function(icon) {
        icon.addEventListener('click', function() {
            const input = this.parentElement.querySelector('input');
            input.type = input.type === 'password' ? 'text' : 'password';
        });
    });
    </script>

</body>
</html>
